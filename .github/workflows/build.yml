name: Build from zip

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show what is in the repo
        run: find . -not -path './.git/*' -maxdepth 3 | head -50

      - name: Find the project
        run: |
          ZIP="$(find . -iname '*.zip' -not -path './.git/*' | head -1)"
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            mkdir -p src_unzipped
            unzip -q "$ZIP" -d src_unzipped
          fi
          SETTINGS="$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)"
          if [ -z "$SETTINGS" ]; then echo "No project found"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Project folder: $(dirname "$SETTINGS")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TuckShopManager-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
